<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
<title id="title">Engineering workflow</title><desc id="desc">A four-stage workflow: understand, design, build, validate and improve.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1224"/><stop offset="1" stop-color="#172554"/></linearGradient>
 <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="250" rx="24" fill="url(#bg)"/>
<path d="M145 103 H1055" stroke="url(#line)" stroke-width="3" stroke-linecap="round" opacity=".75"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
 <g transform="translate(145 103)"><circle r="34" fill="#0F2944" stroke="#38BDF8" stroke-width="2"/><path d="M-10 -8h20M-10 0h15M-10 8h10" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round"/><circle cx="13" cy="-11" r="4" fill="#A78BFA"/><text y="66" fill="#F8FAFC" font-size="17" font-weight="700">01 · UNDERSTAND</text><text y="89" fill="#94A3B8" font-size="12">Problem &amp; context</text></g>
 <g transform="translate(448 103)"><circle r="34" fill="#171F45" stroke="#818CF8" stroke-width="2"/><path d="M-13 -12h26v24h-26z M-7 -5h14 M-7 1h14 M-7 7h8" fill="none" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round"/><text y="66" fill="#F8FAFC" font-size="17" font-weight="700">02 · DESIGN</text><text y="89" fill="#94A3B8" font-size="12">Architecture &amp; data</text></g>
 <g transform="translate(751 103)"><circle r="34" fill="#102B3B" stroke="#22D3EE" stroke-width="2"/><path d="M-13 -10l-9 10 9 10M13 -10l9 10-9 10M4 -15l-8 30" fill="none" stroke="#67E8F9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text y="66" fill="#F8FAFC" font-size="17" font-weight="700">03 · BUILD</text><text y="89" fill="#94A3B8" font-size="12">Implement &amp; integrate</text></g>
 <g transform="translate(1055 103)"><circle r="34" fill="#2B1B42" stroke="#C084FC" stroke-width="2"/><path d="M-14 0l9 9 19-20" fill="none" stroke="#D8B4FE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text y="66" fill="#F8FAFC" font-size="17" font-weight="700">04 · VALIDATE</text><text y="89" fill="#94A3B8" font-size="12">Test &amp; improve</text></g>
</g>
<text x="600" y="222" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle" letter-spacing="2">A PRACTICAL, ITERATIVE APPROACH TO BUILDING SOFTWARE</text>
</svg>