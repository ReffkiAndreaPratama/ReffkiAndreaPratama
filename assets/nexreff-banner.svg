<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">NEXREFF — Developer profile</title>
<desc id="desc">A dark navy developer banner with electric blue and violet gradients, geometric grid lines, orbital rings, and the NEXREFF wordmark.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d1b"/><stop offset=".52" stop-color="#111d3b"/><stop offset="1" stop-color="#24144b"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38bdf8"/><stop offset=".55" stop-color="#6366f1"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
  <radialGradient id="spot"><stop stop-color="#4f46e5" stop-opacity=".48"/><stop offset="1" stop-color="#4f46e5" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#9db6ff" stroke-opacity=".09" stroke-width="1"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
  <filter id="shadow"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<rect width="1200" height="390" rx="28" fill="url(#bg)"/>
<rect width="1200" height="390" rx="28" fill="url(#grid)"/>
<circle cx="950" cy="140" r="260" fill="url(#spot)"/>
<circle cx="1050" cy="350" r="140" fill="#0ea5e9" opacity=".13" filter="url(#blur)"/>
<g fill="none" stroke="url(#glow)" opacity=".55">
  <circle cx="975" cy="190" r="128" stroke-width="1.5"/>
  <circle cx="975" cy="190" r="164" stroke-width="1" stroke-dasharray="5 12"/>
  <ellipse cx="975" cy="190" rx="210" ry="74" transform="rotate(-28 975 190)" stroke-width="1.2"/>
  <ellipse cx="975" cy="190" rx="210" ry="74" transform="rotate(48 975 190)" stroke-width="1.2"/>
</g>
<g fill="#dbeafe"><circle cx="975" cy="62" r="4"/><circle cx="1136" cy="210" r="3"/><circle cx="842" cy="300" r="4"/><circle cx="1078" cy="338" r="2.5"/></g>
<path d="M0 320 C180 270 260 365 440 320 S720 270 840 320" stroke="url(#glow)" stroke-opacity=".25" stroke-width="1.5" fill="none"/>
<rect x="72" y="65" width="5" height="206" rx="2.5" fill="url(#glow)"/>
<text x="105" y="92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#93c5fd">INFORMATICS • SOFTWARE • ENGINEERING</text>
<text x="98" y="190" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="82" font-weight="800" letter-spacing="-3" fill="#ffffff">NEXREFF</text>
<text x="105" y="238" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#cbd5e1">Build useful things. Understand how they work.</text>
<g transform="translate(105 278)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">
  <rect width="130" height="34" rx="17" fill="#172554" stroke="#3b82f6" stroke-opacity=".7"/><text x="65" y="22" text-anchor="middle" fill="#bfdbfe">WEB DEV</text>
  <rect x="143" width="150" height="34" rx="17" fill="#1e1b4b" stroke="#818cf8" stroke-opacity=".7"/><text x="218" y="22" text-anchor="middle" fill="#c7d2fe">COMPUTER VISION</text>
  <rect x="306" width="86" height="34" rx="17" fill="#312e81" stroke="#a78bfa" stroke-opacity=".7"/><text x="349" y="22" text-anchor="middle" fill="#ddd6fe">GIS</text>
</g>
<text x="1090" y="365" text-anchor="end" font-family="monospace" font-size="12" letter-spacing="2" fill="#94a3b8">NXR / 001</text>
</svg>