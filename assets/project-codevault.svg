  const</text><text x="225" y="124" fill="#86efac"> response</text><text x="292" y="124" fill="#e2e8f0"> = await fetch(url);</text><text x="148" y="150" fill="#64748b">03</text><text x="176" y="150" fill="#c084fc">  return</text><text x="230" y="150" fill="#e2e8f0"> response.json();</text><text x="148" y="176" fill="#64748b">04</text><text x="176" y="176" fill="#e2e8f0">};</text></g><rect x="148" y="194" width="90" height="18" rx="9" fill="#312e81"/><text x="193" y="207" text-anchor="middle" fill="#c7d2fe" font-family="Arial" font-size="9">JAVASCRIPT</text></g><text x="58" y="62" fill="#93c5fd" font-family="Arial" font-size="14" font-weight="700" letter-spacing="4">CODEVAULT</text><text x="58" y="98" fill="#e2e8f0" font-family="Arial" font-size="19">Organize reusable snippets with a focused editor</text><text x="1140" y="326" text-anchor="end" fill="#64748b" font-family="monospace" font-size="12" letter-spacing="2">PROJECT VISUAL • CONCEPT ART</text></svg>