<g transform="translate(800 198)">
  <rect width="342" height="242" rx="14" fill="#172a2c" stroke="#28635b"/>
  <rect width="342" height="5" rx="2" fill="#34d399"/>
  <text x="22" y="38" class="head">03 / ENGINEERING FOUNDATIONS</text>
  <text x="22" y="72" class="item">Git · GitHub · Bash</text>
  <text x="22" y="101" class="item">REST-oriented workflows</text>
  <text x="22" y="130" class="item">Relational data modelling</text>
  <text x="22" y="159" class="item">Testing &amp; debugging</text>
