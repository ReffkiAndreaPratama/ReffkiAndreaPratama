  <text x="22" y="72" class="item">Laravel · PHP · Blade</text>
  <text x="22" y="101" class="item">JavaScript · Tailwind CSS</text>
  <text x="22" y="130" class="item">MySQL · SQLite</text>
  <text x="22" y="159" class="item">Python · OpenCV</text>
  <text x="22" y="188" class="item">scikit-learn · GLCM</text>
  <text x="22" y="217" class="item">Leaflet · GeoJSON · QGIS</text>
</g>
<g transform="translate(429 198)">
  <rect width="342" height="242" rx="14" fill="#1b1c3a" stroke="#51417b"/>
  <rect width="342" height="5" rx="2" fill="#a78bfa"/>
  <text x="22" y="38" class="head">02 / CURRENTLY EXPLORING</text>
  <text x="22" y="72" class="item">Computer vision &amp; medical imaging</text>
  <text x="22" y="101" class="item">Speech recognition / low-resource ASR</text>
