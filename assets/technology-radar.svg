<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Technology radar and engineering toolkit</title>
<desc id="desc">A categorized overview of technologies used in projects, currently explored, and foundational tools.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1224"/><stop offset="1" stop-color="#111c35"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <style>
    .h{font:700 25px 'Segoe UI',Arial,sans-serif;fill:#f8fafc}.sub{font:13px 'Segoe UI',Arial,sans-serif;fill:#94a3b8}
    .head{font:700 15px 'Segoe UI',Arial,sans-serif;fill:#e2e8f0}.item{font:14px 'Segoe UI',Arial,sans-serif;fill:#cbd5e1}
    .tag{font:11px 'Segoe UI',Arial,sans-serif;fill:#7dd3fc;letter-spacing:1px}
  </style>
</defs>
<rect width="1200" height="520" rx="24" fill="url(#bg)"/>
<rect x="24" y="24" width="1152" height="472" rx="18" fill="none" stroke="#263550"/>
<text x="58" y="70" class="tag">ENGINEERING TOOLKIT / 2026</text>
<text x="58" y="108" class="h">Technology radar</text>
<text x="58" y="134" class="sub">A practical snapshot of tools across projects and ongoing exploration — not a proficiency ranking.</text>
<rect x="58" y="166" width="1084" height="2" rx="1" fill="url(#line)"/>
<g transform="translate(58 198)">
  <rect width="342" height="242" rx="14" fill="#14233d" stroke="#28506b"/>
  <rect width="342" height="5" rx="2" fill="#38bdf8"/>
